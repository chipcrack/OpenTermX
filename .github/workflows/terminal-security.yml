name: terminal-security

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/terminal-security.test.mjs'
      - 'package*.json'
      - '.github/workflows/terminal-security.yml'

permissions:
  contents: read

jobs:
  focused-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - run: npm run build
      - name: SSH trust and keyboard checks
        run: node --test scripts/terminal-security.test.mjs
      - name: Persistent host key checks
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib host_keys::tests
